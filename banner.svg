  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <circle cx="1080" cy="60" r="120" fill="url(#accent)" opacity="0.06"/>
  <circle cx="120" cy="280" r="90" fill="url(#accent)" opacity="0.05"/>
